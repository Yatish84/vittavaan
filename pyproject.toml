[project]
name = "vittavaan"
version = "0.1.0"
description = "Vittavaan wealth management application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/vittavaan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vittavaan"]
mypy_path = "backend"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=backend/vittavaan --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires the local PostgreSQL, Valkey and worker services"
]

[tool.coverage.run]
branch = true
